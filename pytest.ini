[pytest]
# Raíz del repositorio: solo las pruebas del framework (auto_testing/).
# Cada aplicación tiene su propio pytest.ini en sitios/<sitio>/.
testpaths = tests
addopts = -ra --sin-registro --sin-pdf -p no:playwright
markers =
    escenario: documenta el escenario de prueba (lo registra el plugin auto_testing)
