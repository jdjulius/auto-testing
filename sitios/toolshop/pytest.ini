[pytest]
# Ejecutar desde esta carpeta (cd sitios/toolshop && pytest) o con -c sitios/toolshop/pytest.ini
pythonpath = ../..
testpaths = tests
base_url = https://practicesoftwaretesting.com
addopts = -ra --browser chromium --alluredir=reportes/allure-results --clean-alluredir
markers =
    escenario: documenta el escenario de prueba (lo registra el plugin auto_testing)

# --- Captura de las APIs que consume la UI (auto_testing.apis.plugin) ---
capturar_apis = true
apis_hosts_propios =
    api.practicesoftwaretesting.com
# Tráfico que no es de la aplicación: métricas y protección de Cloudflare, traducciones
apis_excluir =
    /cdn-cgi/
    /assets/i18n/
apis_pantallas = pages.mapa:pantalla_de_ruta
apis_openapi = https://api.practicesoftwaretesting.com/docs?api-docs.json
